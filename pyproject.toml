[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-auto-confirm"
version = "1.0.0"
description = "Windows watchdog for OpenAI Codex CLI: auto-confirm permission prompts and self-heal 429/5xx errors without stealing focus."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "NJCN-AXIO" }]
keywords = ["codex", "openai", "watchdog", "rpa", "windows", "automation"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pynput>=1.7.0",
    "pystray>=0.19.0",
    "pillow>=10.0.0",
]

# NOTE: this project is normally run as a PyInstaller-packaged EXE or by
# invoking scripts/codex_auto_confirm.py directly.  The pyproject.toml ships
# for metadata/tooling; we do not enforce a pip-installable layout.

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# This watchdog is intentionally fail-safe: any detector thread must not crash
# the whole monitor, so blind `except Exception` and `except: pass` are by
# design.  The original code uses compact one-liners in a few places and
# tests use lambdas as callables; we leave those alone.
ignore = [
    "BLE001",   # blind except Exception — fail-safe watchdog design
    "S110",     # try-except-pass — same
    "B023",     # lambda closures in tests
    "DTZ005",   # local timestamps in log header
    "SIM115",   # open() in _setup_log_tee needs a long-lived file handle
    "UP031",    # % formatting in the log header
    "E701",     # compact one-liners in original code
    "E702",     # semicolon one-liners in original code/tests
    "E731",     # lambda callables in tests
    "E501",     # long lines in embedded JS / websocket calls / dense tests
]

